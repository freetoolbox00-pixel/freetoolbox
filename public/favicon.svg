<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Toolbox body -->
  <rect x="96" y="220" width="320" height="200" rx="24" fill="white" opacity="0.95"/>
  <!-- Toolbox handle -->
  <rect x="176" y="160" width="160" height="80" rx="16" fill="none" stroke="white" stroke-width="24" opacity="0.95"/>
  <!-- Toolbox latch -->
  <rect x="232" y="220" width="48" height="32" rx="8" fill="#2563eb"/>
  <!-- Wrench icon inside -->
  <g transform="translate(256,330)" opacity="0.85">
    <circle cx="-40" cy="-20" r="22" fill="none" stroke="#2563eb" stroke-width="10"/>
    <line x1="-24" y1="-4" x2="40" y2="60" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="40" cy="60" r="12" fill="#2563eb"/>
  </g>
</svg>
